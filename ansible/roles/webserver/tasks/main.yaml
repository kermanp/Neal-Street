---
- name: Update apt cache and upgrade system packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Install required core packages
  ansible.builtin.apt:
    name: "{{ sys_packages }}"
    state: present

- name: Configure UFW firewall rules
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"   # SSH
    - "80"   # HTTP
    - "443"  # HTTPS
  notify: Enable UFW

- name: Deploy dynamic web landing page template
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
  notify: Restart Nginx

- name: Ensure Nginx service is enabled and running
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true